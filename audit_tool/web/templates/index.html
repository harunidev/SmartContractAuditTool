<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Contract Audit Tool</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #273549;
    --accent: #6366f1;
    --accent2: #818cf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --critical: #dc2626;
    --high: #ea580c;
    --medium: #d97706;
    --low: #2563eb;
    --info: #64748b;
    --radius: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Layout ── */
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid #2d3f56;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header .logo {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header p  { font-size: 12px; color: var(--muted); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 0;
    overflow: hidden;
  }

  /* ── Left panel ── */
  .panel-left {
    background: var(--surface);
    border-right: 1px solid #2d3f56;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 14px;
    overflow-y: auto;
    min-height: calc(100vh - 72px);
  }

  label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  textarea {
    width: 100%;
    height: 320px;
    background: #0f172a;
    border: 1px solid #2d3f56;
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 12px;
    padding: 12px;
    resize: vertical;
    outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--accent); }

  .file-drop {
    border: 2px dashed #2d3f56;
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    transition: border-color .2s, background .2s;
  }
  .file-drop:hover, .file-drop.drag { border-color: var(--accent); background: #1e293b88; }
  .file-drop input[type=file] { display: none; }

  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid #2d3f56; }

  .options { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }

  .btn {
    padding: 12px 24px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: opacity .2s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Right panel ── */
  .panel-right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .tab-bar {
    display: flex;
    gap: 2px;
    padding: 12px 20px 0;
    background: var(--surface2);
    border-bottom: 1px solid #2d3f56;
  }
  .tab {
    padding: 8px 18px;
    border-radius: 6px 6px 0 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    background: transparent;
    border: none;
    transition: color .2s;
  }
  .tab.active { background: var(--surface); color: var(--text); }

  .tab-content { flex: 1; overflow: auto; }
  .tab-pane { display: none; height: 100%; }
  .tab-pane.active { display: flex; flex-direction: column; height: 100%; }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 14px;
  }
  .empty-state .icon { font-size: 48px; opacity: .4; }
  .empty-state p { font-size: 14px; }

  /* Summary cards */
  .summary-bar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid #2d3f56;
    background: var(--surface2);
  }
  .sev-card {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    min-width: 80px;
    text-align: center;
  }

  /* Findings list */
  .findings-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .finding-card {
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 14px 16px;
    border-left: 4px solid transparent;
    cursor: pointer;
    transition: background .15s;
  }
  .finding-card:hover { background: #2e3f56; }
  .finding-card.CRITICAL { border-color: var(--critical); }
  .finding-card.HIGH     { border-color: var(--high); }
  .finding-card.MEDIUM   { border-color: var(--medium); }
  .finding-card.LOW      { border-color: var(--low); }
  .finding-card.INFO     { border-color: var(--info); }

  .finding-header { display: flex; align-items: center; gap: 8px; }
  .finding-title { font-size: 13px; font-weight: 600; flex: 1; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    color: #fff;
    white-space: nowrap;
  }
  .finding-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Report iframe */
  #report-frame {
    flex: 1;
    border: none;
    background: #fff;
    width: 100%;
  }

  /* Spinner */
  .spinner {
    display: none;
    width: 20px; height: 20px;
    border: 3px solid #ffffff44;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2d3f56; border-radius: 3px; }

  @media (max-width: 768px) {
    main { grid-template-columns: 1fr; }
    .panel-left { min-height: auto; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">🔍</div>
    <div>
      <h1>Smart Contract Audit Tool</h1>
      <p>Static analysis + Claude AI — EVM / Solidity</p>
    </div>
  </header>

  <main>
    <!-- ── Left: Input ── -->
    <div class="panel-left">
      <div>
        <label for="code-input">Paste Solidity Code</label>
        <textarea id="code-input" placeholder="// SPDX-License-Identifier: MIT
pragma solidity ^0.8.0;

contract MyToken { ... }"></textarea>
      </div>

      <div class="divider">or upload a file</div>

      <div class="file-drop" id="file-drop" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" accept=".sol,.txt">
        <div>📂 Drop .sol file here or click to browse</div>
        <div id="file-name" style="margin-top:6px;font-size:11px;color:#818cf8;"></div>
      </div>

      <div class="options">
        <label class="toggle">
          <input type="checkbox" id="use-ai" checked>
          Enable Claude AI analysis
        </label>
        <select id="format-select" style="background:var(--surface2);color:var(--text);border:1px solid #2d3f56;border-radius:6px;padding:6px 10px;font-size:12px;">
          <option value="html">HTML report</option>
          <option value="json">JSON report</option>
        </select>
      </div>

      <button class="btn btn-primary" id="audit-btn" onclick="runAudit()">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">Run Audit</span>
      </button>

      <div id="error-msg" style="display:none;background:#450a0a;color:#fca5a5;padding:12px;border-radius:8px;font-size:13px;"></div>
    </div>

    <!-- ── Right: Results ── -->
    <div class="panel-right">
      <div class="tab-bar">
        <button class="tab active" onclick="switchTab('findings')">Findings</button>
        <button class="tab" onclick="switchTab('report')">Full Report</button>
      </div>

      <div class="tab-content">
        <!-- Findings tab -->
        <div class="tab-pane active" id="tab-findings">
          <div id="findings-empty" class="empty-state">
            <div class="icon">🛡️</div>
            <p>Paste a contract and click <strong>Run Audit</strong></p>
          </div>
          <div id="findings-results" style="display:none;">
            <div class="summary-bar" id="summary-bar"></div>
            <div class="findings-list" id="findings-list"></div>
          </div>
        </div>

        <!-- Report tab -->
        <div class="tab-pane" id="tab-report" style="background:#fff;">
          <div id="report-empty" class="empty-state" style="background:var(--bg);">
            <div class="icon">📄</div>
            <p>Run an audit to see the full report</p>
          </div>
          <iframe id="report-frame" style="display:none;"></iframe>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const SEV_COLORS = {
  CRITICAL: '#dc2626', HIGH: '#ea580c',
  MEDIUM: '#d97706', LOW: '#2563eb', INFO: '#64748b'
};

let currentReportHtml = '';

// ── File drop ────────────────────────────────────────────────────────────────
const dropZone = document.getElementById('file-drop');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('code-input').value = e.target.result;
    document.getElementById('file-name').textContent = '✓ ' + file.name;
  };
  reader.readAsText(file);
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const tabs = ['findings', 'report'];
    t.classList.toggle('active', tabs[i] === name);
  });
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

// ── Audit ─────────────────────────────────────────────────────────────────────
async function runAudit() {
  const source = document.getElementById('code-input').value.trim();
  if (!source) { showError('Please paste Solidity code or upload a .sol file.'); return; }

  setLoading(true);
  hideError();

  const useAi = document.getElementById('use-ai').checked;
  const fmt = document.getElementById('format-select').value;

  try {
    if (fmt === 'json') {
      const resp = await fetch(`/api/audit?ai=${useAi}&format=json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source_code: source })
      });
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'audit_report.json'; a.click();
      URL.revokeObjectURL(url);
      setLoading(false);
      return;
    }

    const resp = await fetch(`/api/audit?ai=${useAi}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source_code: source })
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error || 'Server error');
    }

    const data = await resp.json();
    renderFindings(data);
    renderReport(data.report_html);

    if (data.ai_error) showError('AI analysis unavailable: ' + data.ai_error);
  } catch (e) {
    showError(e.message);
  } finally {
    setLoading(false);
  }
}

function renderFindings(data) {
  const counts = {};
  data.findings.forEach(f => { counts[f.severity] = (counts[f.severity] || 0) + 1; });

  // Summary bar
  const bar = document.getElementById('summary-bar');
  bar.innerHTML = Object.entries(SEV_COLORS).map(([sev, col]) => {
    const n = counts[sev] || 0;
    return `<div class="sev-card" style="background:${col}">${sev}<br>${n}</div>`;
  }).join('');

  // Findings list
  const list = document.getElementById('findings-list');
  list.innerHTML = data.findings.length === 0
    ? '<p style="color:var(--muted);font-size:13px;">No findings detected — contract looks clean!</p>'
    : data.findings.map((f, i) => `
      <div class="finding-card ${f.severity}">
        <div class="finding-header">
          <div class="finding-title">#${i + 1} ${f.title}</div>
          <span class="badge" style="background:${SEV_COLORS[f.severity]}">${f.severity}</span>
        </div>
        <div class="finding-meta">${f.category}${f.line ? ' · Line ' + f.line : ''} · ${f.source === 'ai' ? 'AI' : 'Static'}</div>
      </div>`).join('');

  document.getElementById('findings-empty').style.display = 'none';
  document.getElementById('findings-results').style.display = 'block';
  switchTab('findings');
}

function renderReport(html) {
  currentReportHtml = html;
  const frame = document.getElementById('report-frame');
  const empty = document.getElementById('report-empty');
  frame.srcdoc = html;
  frame.style.display = 'block';
  empty.style.display = 'none';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function setLoading(on) {
  document.getElementById('audit-btn').disabled = on;
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('btn-text').textContent = on ? '' : 'Run Audit';
}
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-msg').style.display = 'none';
}
</script>
</body>
</html>
